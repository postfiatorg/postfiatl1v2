[package]
name = "postfiat-privacy-binius"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
portable = ["pft-binius-shielded/portable"]

[dependencies]
postfiat-types = {path="../types"}
postfiat-crypto-provider = {path="../crypto_provider"}
# The validator checks each input's ML-DSA-65 spend authorization (`PaymentTx::verify_spend_auth`),
# which the tool implements under its `prover` feature. Without it this crate, and the node binary,
# does not compile; only test builds had it, through the dev-dependency below.
pft-binius-shielded = { path = "../../tools/pft-binius-shielded-pq/rust-prover", default-features = false, features = ["prover"] }

[dev-dependencies]
pft-binius-shielded = {path = "../../tools/pft-binius-shielded-pq/rust-prover", features=["prover"]}
rand_chacha = "0.3"
serde_json.workspace = true
sha2.workspace = true
