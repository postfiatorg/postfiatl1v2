[package]
name = "postfiat-types"
version = "0.1.0"
description = "Canonical protocol and state types for PostFiat L1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# Lets tests set the second Solana exit release height per thread.
test-second-release = []

[dependencies]
imbl = "7.0.2"
base64.workspace = true
postfiat-crypto-provider = {path = "../crypto_provider"}
serde = { workspace = true }
serde_json = { workspace = true }
serde_cbor = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
solana-epoch-schedule = "=3.4.0"

[dev-dependencies]
