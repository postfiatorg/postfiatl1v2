[package]
name = "postfiat-execution"
version = "0.1.0"
description = "Deterministic state-transition execution for PostFiat L1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false }
postfiat-bridge = { path = "../bridge" }
postfiat-crypto-provider = { path = "../crypto_provider" }
postfiat-nav-reserve-protocol = { path = "../nav_reserve_protocol" }
postfiat-types = { path = "../types" }
sp1-verifier = "6.3.1"

[dev-dependencies]
postfiat-types = { path = "../types", features = ["test-second-release"] }
pfusdc-sol-ingress-program = { path = "../../programs/pfusdc-sol-ingress" }
serde_json = { workspace = true }
