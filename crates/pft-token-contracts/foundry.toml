[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
# test/DeployPFTLock.t.sol deploys the real PFTLFinalityVerifierV1 to test the script's probe against it.
# include_paths makes the whole crates/ tree a source search path; allow_paths
# does not restrict what a test may import. The deployed artifacts (PFTLockV1,
# PFTToken) are byte-identical with and without them.
allow_paths = ["../ethereum-contracts/src"]
include_paths = [".."]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Base supports Cancun; pinned so the bytecode and the verification settings never drift.
evm_version = "cancun"
# Verification inputs: the metadata hash appended to the bytecode. Both are
# forge's defaults, pinned so the deployed bytecode and the explorer
# verification cannot drift.
bytecode_hash = "ipfs"
cbor_metadata = true
# The deploy script reads the effective compiler settings from out/ and writes the
# deployment record; its tests read the Safe bytecode fixtures and write their
# records under cache/deploy-test.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./cache/deploy-test" },
]

# Contract verification on Basescan. The key is read from the environment and is
# never written in this file.
[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 32
# Every handler call must succeed; invariant_HandlerMadeCalls checks calls happened.
fail_on_revert = true
