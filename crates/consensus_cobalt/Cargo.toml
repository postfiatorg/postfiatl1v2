[package]
name = "postfiat-consensus-cobalt"
version = "0.1.0"
description = "PostFiat L1 Cobalt consensus and governance primitives"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables schema-only, unsigned Cobalt validators and quorum evaluators used by
# adversarial simulations. Production builds must leave this feature disabled.
cobalt-unsafe-simulation = []

[dependencies]
postfiat-crypto-provider = { path = "../crypto_provider" }
postfiat-types = { path = "../types" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
postfiat-mempool-dag = { path = "../mempool_dag" }

[[example]]
name = "cobalt_abba_byzantine"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_adversarial_harness"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_adversarial_soak"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_crash_restart"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_dabc_invalid_candidates"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_governance_spam"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_live_process_kill"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_parser_payload_fuzz"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
name = "cobalt_partition_simulation"
required-features = ["cobalt-unsafe-simulation"]

[[example]]
