[package]
name = "postfiat-pftl-uniswap-proofs"
version = "0.1.0"
description = "Pure proof statement for finalized PFTL-Uniswap primary mint receipts"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
mldsa-guest-acceleration = ["postfiat-pfusdc-proofs/mldsa-guest-acceleration"]
mldsa-cycle-tracking = ["postfiat-pfusdc-proofs/mldsa-cycle-tracking"]

[dependencies]
postfiat-crypto-provider = { path = "../crypto_provider" }
postfiat-pfusdc-proofs = { path = "../pfusdc_proofs" }
postfiat-types = { path = "../types" }
serde = { workspace = true }
sha3 = { workspace = true }

