name: release-build

# Builds the artifacts of a public release: the node for both architectures,
# the unit bundle, the SBOM and the checksums. It signs nothing and publishes
# nothing. The release lead builds the manifest from these artifacts and two
# of the three release signers sign it offline (docs/release-process.md).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.arch }}, ${{ matrix.builder }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        arch: [linux-x86_64, linux-aarch64]
        builder: [first, second]
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the production node with its release features
        run: cargo build --locked --release -p postfiat-node --bin postfiat-node
      - name: Name the binary by its architecture and say what was built
        run: |
          cp target/release/postfiat-node "postfiat-node-${{ matrix.arch }}"
          sha256sum "postfiat-node-${{ matrix.arch }}"
          "./postfiat-node-${{ matrix.arch }}" release-build-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.builder }}-postfiat-node-${{ matrix.arch }}
          path: postfiat-node-${{ matrix.arch }}
          if-no-files-found: error

  bundle:
    name: unit bundle, SBOM and checksums
    needs: node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-postfiat-node-*'
          path: builds
      - name: Require matching independent native builds for each target
        run: |
          mkdir release
          for arch in linux-x86_64 linux-aarch64; do
            file="postfiat-node-$arch"
            cmp -- "builds/first-$file/$file" "builds/second-$file/$file"
            install -m 0755 "builds/first-$file/$file" "release/$file"
          done
      - name: Assemble the release directory
        run: scripts/release-assemble release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postfiat-release-unsigned
          path: release
          if-no-files-found: error
