name: product-security-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tree-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Secret-scanner regression
        run: |
          scripts/test-public-secret-scan
          scripts/test-verify-publication-candidate
      - name: Scan the exact tracked publication tree
        run: scripts/public-secret-scan
      - name: Reject live infrastructure and unsafe TLS runtime defaults
        run: |
          scripts/test-public-runtime-default-scan
          scripts/public-runtime-default-scan
          scripts/test-public-source-portability
      - name: Verify public RPC exposure and authorization classification
        run: scripts/test-rpc-method-inventory
      - name: Verify binary and media artifact disposition
        run: scripts/test-public-artifact-policy
      - name: Verify consensus determinism surface
        run: scripts/test-consensus-determinism-surface
      - name: Verify cryptographic call-site policy
        run: |
          scripts/test-crypto-callsite-policy
          scripts/test-proof-public-input-inventory
          scripts/check-a666-public-adapter-readiness
      - name: Verify repository redaction fixtures
        run: |
          node scripts/test-navswap-redaction-check.mjs
          node scripts/navswap-redaction-check.mjs --repo-only
      - name: Verify P0/P1 closure-table coverage
        run: scripts/test-productionization-closure-table

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check
      - name: Verify vendored Halo2 source and licenses
        run: scripts/verify-vendored-halo2
      - name: Generate deterministic CycloneDX SBOM
        run: |
          scripts/test-generate-cargo-sbom
          scripts/generate-cargo-sbom postfiat-cargo-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postfiat-cargo-sbom
          path: postfiat-cargo-sbom.cdx.json

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Python SDK and operations regressions
        env:
          PYTHONPATH: python
        run: |
          python -m pytest python/tests
          python scripts/test-a666-remote-sync-round.py

  wallet-and-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Wallet proxy dependencies and regressions
        working-directory: wallet-proxy
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
      - name: Browser wallet dependencies, tests, and static build
        working-directory: wallet-web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build
      - name: Verify provider-neutral wallet and proxy boundary
        run: scripts/check-provider-neutral-wallet-boundary

  open-reserve-proof-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.3.6
      - name: Install pinned Rust toolchain and protobuf compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup toolchain install nightly-2026-07-15 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          cargo +nightly-2026-07-15 install cargo-fuzz --version 0.13.2 --locked
      - name: Install pinned SP1 guest toolchain
        env:
          # sp1up resolves the pinned release through the GitHub API. Authenticate
          # that read so shared-runner IP rate limits cannot disable this gate.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://sp1up.succinct.xyz | bash
          "$HOME/.sp1/bin/sp1up" --version 6.3.1
          export PATH="$HOME/.sp1/bin:$PATH"
          cargo prove --version | grep -F 'cargo-prove sp1'
      - name: Verify provider-neutral source boundary
        run: |
          if rg --ignore-case 'stake.?hub' tools/nav-reserve-proof; then
            echo 'open reserve-proof kit contains an internal-provider reference' >&2
            exit 1
          fi
      - name: Test and format-check the open proof kit
        working-directory: tools/nav-reserve-proof
        run: |
          cargo test --locked
          cargo fmt --all -- --check
          python3 ../../scripts/test-a666-build-live-nav-mark-ops.py
          python3 ../../scripts/test-a666-build-route-epoch-advance.py
          python3 ../../scripts/test-a666-build-route-migration-control-ops.py
          cargo test --manifest-path contracts/solana-stake-reader/Cargo.toml --locked
          cargo +nightly-2026-07-15 fuzz check --fuzz-dir fuzz --sanitizer none
      - name: Fuzz attacker-controlled reserve proof inputs
        env:
          POSTFIAT_NAV_FUZZ_SECONDS: 10
          POSTFIAT_NAV_FUZZ_TOOLCHAIN: nightly-2026-07-15
        run: scripts/check-nav-reserve-proof-fuzz-smoke
      - name: Rebuild A666 public reader deployment candidates
        run: |
          scripts/check-a666-public-reader-candidates
          scripts/check-a666-portfolio-valuation-policy
          scripts/check-a666-evm-spot-valuation-policy
          scripts/check-a666-monero-policies
          scripts/check-a666-near-solana-valuation-policies
      - name: Rebuild the public Solana stake reader deterministically
        run: |
          cargo install solana-verify --version 0.5.1 --locked
          scripts/check-solana-stake-reader-identity --build
      - name: Compile the pinned SP1 host integration
        working-directory: tools/nav-reserve-proof
        run: cargo check --locked -p postfiat-reserve-proof --features sp1
      - name: Rebuild and verify the immutable legacy guest identity
        working-directory: tools/nav-reserve-proof/programs/reserve-proof-guest
        run: |
          export PATH="$HOME/.sp1/bin:$PATH"
          expected_sha="$(jq -r .elf_sha256 ../../program-identity.json)"
          expected_vkey="$(jq -r .program_vkey ../../program-identity.json)"
          expected_source="$(jq -r .source_commit ../../program-identity.json)"
          test "$(git cat-file -t "$expected_source")" = commit
          legacy_workspace="$(mktemp -d)"
          git -C "$GITHUB_WORKSPACE" archive "$expected_source" | \
            tar -x -C "$legacy_workspace"
          rebuild_dir="$(mktemp -d)"
          cd "$legacy_workspace/tools/nav-reserve-proof/programs/reserve-proof-guest"
          cargo prove build --docker --tag v6.3.1 --locked \
            --workspace-directory "$legacy_workspace" \
            --output-directory "$rebuild_dir"
          rebuilt_elf="$rebuild_dir/postfiat-reserve-proof-guest"
          test -s "$rebuilt_elf"
          actual_sha="$(sha256sum "$rebuilt_elf" | cut -d' ' -f1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            printf 'guest ELF SHA mismatch: expected %s, got %s\n' \
              "$expected_sha" "$actual_sha" >&2
            exit 1
          fi
          cargo run --locked --release \
            --manifest-path "$GITHUB_WORKSPACE/tools/nav-reserve-proof/Cargo.toml" \
            -p postfiat-reserve-proof --features sp1 -- \
            program-info --elf "$rebuilt_elf" \
            > /tmp/postfiat-reserve-program-info.json
          jq -e --arg sha "$expected_sha" --arg vkey "$expected_vkey" \
            '.elf_sha256 == $sha and .program_vkey == $vkey' \
            /tmp/postfiat-reserve-program-info.json
      - name: Verify and rebuild the immutable A666 public successor identity
        working-directory: tools/nav-reserve-proof/programs/reserve-proof-guest
        run: |
          export PATH="$HOME/.sp1/bin:$PATH"
          identity="$GITHUB_WORKSPACE/tools/nav-reserve-proof/a666-successor-program-identity.json"
          manifest="$GITHUB_WORKSPACE/tools/nav-reserve-proof/manifests/a666/source-manifest-public-successor.json"
          registration="$GITHUB_WORKSPACE/tools/nav-reserve-proof/manifests/a666/profile-registration-public-successor.json"
          host_manifest="$GITHUB_WORKSPACE/tools/nav-reserve-proof/Cargo.toml"
          expected_sha="$(jq -r .elf_sha256 "$identity")"
          expected_vkey="$(jq -r .program_vkey "$identity")"
          expected_source="$(jq -r .source_commit "$identity")"
          expected_manifest="$(jq -r .source_manifest_hash "$identity")"
          expected_policy="$(jq -r .valuation_policy_hash "$identity")"
          expected_profile="$(jq -r .profile_id "$identity")"

          cargo run --locked --release \
            --manifest-path "$host_manifest" \
            -p postfiat-reserve-proof --features sp1 -- \
            manifest validate "$manifest" \
            > /tmp/a666-public-manifest-validation.json
          jq -e --arg manifest "$expected_manifest" \
            '.valid == true and .source_count == 6 and .source_manifest_hash == $manifest' \
            /tmp/a666-public-manifest-validation.json
          jq -e --arg manifest "$expected_manifest" --arg policy "$expected_policy" \
            '.source_manifest_hash == $manifest and .valuation_policy_hash == $policy and .allow_controlled_sources == false' \
            "$registration"
          cargo run --locked --release \
            --manifest-path "$host_manifest" \
            -p postfiat-reserve-proof --features sp1 -- \
            profile derive --registration "$registration" \
            --output /tmp/a666-public-derived-profile.json
          jq -e --arg profile "$expected_profile" --arg vkey "$expected_vkey" \
            '.profile.profile_id == $profile and .profile.sp1_program_vkey == $vkey' \
            /tmp/a666-public-derived-profile.json

          test "$(git cat-file -t "$expected_source")" = commit
          successor_workspace="$(mktemp -d)"
          git -C "$GITHUB_WORKSPACE" archive "$expected_source" | \
            tar -x -C "$successor_workspace"
          rebuild_dir="$(mktemp -d)"
          cd "$successor_workspace/tools/nav-reserve-proof/programs/reserve-proof-guest"
          cargo prove build --docker --tag v6.3.1 --locked \
            --features a666-public-adapters-v2 \
            --workspace-directory "$successor_workspace" \
            --output-directory "$rebuild_dir"
          rebuilt_elf="$rebuild_dir/postfiat-reserve-proof-guest"
          test -s "$rebuilt_elf"
          actual_sha="$(sha256sum "$rebuilt_elf" | cut -d' ' -f1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            printf 'A666 successor ELF SHA mismatch: expected %s, got %s\n' \
              "$expected_sha" "$actual_sha" >&2
            exit 1
          fi
          cargo run --locked --release \
            --manifest-path "$host_manifest" \
            -p postfiat-reserve-proof --features sp1 -- \
            program-info --elf "$rebuilt_elf" \
            > /tmp/a666-public-successor-program-info.json
          jq -e --arg sha "$expected_sha" --arg vkey "$expected_vkey" \
            '.elf_sha256 == $sha and .program_vkey == $vkey' \
            /tmp/a666-public-successor-program-info.json

          qualification="$GITHUB_WORKSPACE/tools/nav-reserve-proof/qualifications/a666-public-successor-20260802"
          expected_results="$qualification/expected-results.json"
          for epoch in 7 8; do
            epoch_run="$(mktemp -d)"
            cargo run --locked --release \
              --manifest-path "$host_manifest" \
              -p postfiat-reserve-proof --features sp1 -- \
              observe \
              --manifest "$qualification/manifest.json" \
              --context "$qualification/epoch-$epoch/context.json" \
              --input-dir "$qualification/epoch-$epoch/inputs" \
              --output "$epoch_run/observations.json"
            cargo run --locked --release \
              --manifest-path "$host_manifest" \
              -p postfiat-reserve-proof --features sp1 -- \
              witness build \
              --input "$epoch_run/observations.json" \
              --output "$epoch_run/witness.cbor"
            cargo run --locked --release \
              --manifest-path "$host_manifest" \
              -p postfiat-reserve-proof --features sp1 -- \
              execute \
              --witness "$epoch_run/witness.cbor" \
              --elf "$rebuilt_elf" \
              --output "$epoch_run/public-values.bin"
            cargo run --locked --release \
              --manifest-path "$host_manifest" \
              -p postfiat-reserve-proof --features sp1 -- \
              verify --public-values "$epoch_run/public-values.bin" \
              > "$epoch_run/decoded-public-values.json"

            expected_witness="$(jq -r --argjson epoch "$epoch" \
              '.epochs[] | select(.observation_epoch == $epoch) | .witness_cbor_sha256' \
              "$expected_results")"
            expected_public_values="$(jq -r --argjson epoch "$epoch" \
              '.epochs[] | select(.observation_epoch == $epoch) | .public_values_sha256' \
              "$expected_results")"
            actual_witness="$(sha256sum "$epoch_run/witness.cbor" | cut -d' ' -f1)"
            actual_public_values="$(sha256sum "$epoch_run/public-values.bin" | cut -d' ' -f1)"
            test "$actual_witness" = "$expected_witness"
            test "$actual_public_values" = "$expected_public_values"

            jq -e --argjson epoch "$epoch" --slurpfile pins "$expected_results" '
              ($pins[0].epochs[] | select(.observation_epoch == $epoch)) as $pin |
              .pftl_genesis_hash == $pins[0].pftl_genesis_hash and
              .nav_asset_id == $pins[0].nav_asset_id and
              .proof_profile_id == $pins[0].proof_profile_id and
              .source_manifest_hash == $pins[0].source_manifest_hash and
              .valuation_policy_hash == $pins[0].valuation_policy_hash and
              .valuation_unit_id == $pins[0].valuation_unit_id and
              .valuation_scale == $pins[0].valuation_scale and
              .observation_epoch == $pin.observation_epoch and
              .observation_not_before == $pin.observation_not_before and
              .observation_not_after == $pin.observation_not_after and
              .source_observation_root == $pin.source_observation_root and
              .gross_assets == $pin.gross_assets and
              .total_liabilities == $pin.total_liabilities and
              .verified_net_assets == $pin.verified_net_assets and
              .cryptographically_verified_value == $pin.cryptographically_verified_value and
              .attested_value == 0 and .controlled_value == 0 and
              .source_count == 6 and
              .quantity_trust_counts == $pin.quantity_trust_counts and
              .valuation_trust_counts == $pin.valuation_trust_counts and
              .quantity_trust_root == $pin.quantity_trust_root and
              .valuation_trust_root == $pin.valuation_trust_root and
              .source_disclosure_root == $pin.source_disclosure_root
            ' "$epoch_run/decoded-public-values.json"
          done

  evm-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.7.1
      - name: Offline contract suite
        working-directory: crates/ethereum-contracts
        run: forge test --no-match-path 'test/*Fork.t.sol'
      - name: Official fork test cannot silently pass offline
        working-directory: crates/ethereum-contracts
        shell: bash
        run: |
          set -o pipefail
          if env -u ETHEREUM_MAINNET_RPC_URL forge test --match-path test/PFTLUniswapOfficialFork.t.sol -vv 2>&1 | tee /tmp/official-fork-negative.log; then
            echo "official fork test unexpectedly passed without an RPC URL" >&2
            exit 1
          fi
          grep -F 'environment variable "ETHEREUM_MAINNET_RPC_URL" not found' /tmp/official-fork-negative.log

  official-mainnet-fork:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ETHEREUM_MAINNET_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
    steps:
      - name: Record unconfigured real-value gate
        if: env.ETHEREUM_MAINNET_RPC_URL == ''
        run: |
          echo '::warning title=Official mainnet fork not executed::Configure ETHEREUM_MAINNET_RPC_URL to run the real-value integration gate.'
          {
            echo '### Official mainnet fork: not executed'
            echo
            echo 'The repository has no `ETHEREUM_MAINNET_RPC_URL` secret. The offline suite proved that the fork test fails closed without it; no live-fork certification is claimed by this run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.ETHEREUM_MAINNET_RPC_URL != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: env.ETHEREUM_MAINNET_RPC_URL != ''
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.7.1
      - name: Verify official deployments at the pinned mainnet block
        if: env.ETHEREUM_MAINNET_RPC_URL != ''
        working-directory: crates/ethereum-contracts
        run: forge test --match-path test/PFTLUniswapOfficialFork.t.sol -vv
