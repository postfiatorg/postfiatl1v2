name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-node:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the production node with its release features
        run: cargo build --locked --release -p postfiat-node --bin postfiat-node

  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # The node crate's tests. Those named orchard run in test-node-orchard,
    # those named pq_ in test-pq and test-pq-local-chain, the other packages
    # in test-workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the job's start time
        # For the time warning in the job's last step.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: A666 recovery CI rejection policy
        run: |
          scripts/test-check-a666-recovery-ci-policy
          scripts/check-a666-recovery-ci-policy
      - name: cargo test
        run: |
          cargo test -p postfiat-node --locked --no-fail-fast -- --skip pq_ --skip orchard \
            --skip transport_batch_payload_tests::a_peer_refusing_past_the_retry_budget_is_asked_until_the_deadline_and_the_round_certifies \
            --skip transport_batch_payload_tests::a_prepare_answered_8s_late_does_not_delay_an_early_quorum_round
          cargo test --locked -p postfiat-node --bin postfiat-node \
            fastswap_service::tests::persistent_wallet_driver_meets_isolated_warm_latency_gate \
            -- --ignored --exact --nocapture
          cargo test --locked -p postfiat-node --bin postfiat-node \
            validator_signer_socket_tests -- --ignored
          cargo test --locked -p postfiat-node --test validator_signer_two_user_units_process \
            two_user_units_start_the_signer_rpc_and_transport_without_a_data_dir_key -- --ignored --exact
      - name: Transport timing tests, alone on one thread
        # Their wall-clock bounds hold for a round with nothing running beside
        # it. -p postfiat-node reuses the build of the step above.
        if: ${{ !cancelled() }}
        run: |
          cargo test -p postfiat-node --locked -- --exact --test-threads=1 \
            transport_batch_payload_tests::a_peer_refusing_past_the_retry_budget_is_asked_until_the_deadline_and_the_round_certifies \
            transport_batch_payload_tests::a_prepare_answered_8s_late_does_not_delay_an_early_quorum_round
      - name: Warn when the job comes close to its time limit
        # A warning only: this step never fails the job.
        if: always()
        continue-on-error: true
        run: scripts/ci-test-job-time-warning

  test-node-orchard:
    # The node crate's tests named orchard. Its Orchard proving tests take
    # most of an hour on a slow runner, so they do not fit beside the rest.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the job's start time
        # For the time warning in the job's last step.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: cargo test (postfiat-node tests named orchard)
        run: cargo test -p postfiat-node --locked --no-fail-fast -- orchard --skip pq_
      - name: Warn when the job comes close to its time limit
        # A warning only: this step never fails the job.
        if: always()
        continue-on-error: true
        run: scripts/ci-test-job-time-warning

  test-workspace:
    # Every package except the node crate.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the job's start time
        # For the time warning in the job's last step.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: Every test runs in exactly one test job or step
        # The listing builds the whole workspace; the step below reuses that
        # build, because --exclude postfiat-node resolves the same features.
        run: |
          cargo test --workspace --locked -- --list > "$RUNNER_TEMP/test-list.txt" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/test-list.txt"; exit 1; }
          scripts/check-rust-ci-test-split --listing "$RUNNER_TEMP/test-list.txt"
      - name: cargo test
        run: |
          cargo test --workspace --exclude postfiat-node --locked --no-fail-fast -- --skip pq_ \
            --skip tests::fail_fast_dos_rejects_bad_sig_bad_pow_and_aborts_siblings
          cargo test --locked --manifest-path tools/tasknode-validator-binding/Cargo.toml
      - name: Fail-fast timing test of the PQ verifier, optimized and alone
        # Its bounds are milliseconds for rejecting a bad payment. They are a
        # property of the optimized verifier, so it runs in a release build.
        if: ${{ !cancelled() }}
        run: |
          cargo test --release --locked -p postfiat-privacy-binius --lib -- --exact --test-threads=1 \
            tests::fail_fast_dos_rejects_bad_sig_bad_pow_and_aborts_siblings
      - name: Warn when the job comes close to its time limit
        # A warning only: this step never fails the job.
        if: always()
        continue-on-error: true
        run: scripts/ci-test-job-time-warning

  test-pq:
    # The PQ payment tests (every test named pq_) prove for real; beside the
    # rest they no longer fit the two-hour limit of `test`. This job runs
    # those outside the node binary's two local-chain modules, which run in
    # test-pq-local-chain. Both module names contain pq_, so every pq_ test
    # lands in exactly one of the two jobs by its name.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the job's start time
        # For the time warning in the job's last step.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: cargo test (tests named pq_, without the node's local-chain modules)
        run: |
          cargo test --workspace --locked -- pq_ \
            --skip pq_payment_local_chain_tests --skip pq_payment_rehearsal_tests
      - name: Warn when the job comes close to its time limit
        # A warning only: this step never fails the job.
        if: always()
        continue-on-error: true
        run: scripts/ci-test-job-time-warning

  test-pq-local-chain:
    # The node binary's PQ local-chain and rehearsal modules: local validator
    # fleets that prove for real. The other pq_ tests run in test-pq.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the job's start time
        # For the time warning in the job's last step.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: cargo test (the node's PQ local-chain and rehearsal modules)
        run: cargo test --workspace --locked -- pq_payment_local_chain_tests pq_payment_rehearsal_tests
      - name: Warn when the job comes close to its time limit
        # A warning only: this step never fails the job.
        if: always()
        continue-on-error: true
        run: scripts/ci-test-job-time-warning
