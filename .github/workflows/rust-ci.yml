name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: A666 recovery CI rejection policy
        run: |
          scripts/test-check-a666-recovery-ci-policy
          scripts/check-a666-recovery-ci-policy
      - name: cargo test
        run: |
          cargo test --workspace --locked
          cargo test --locked --manifest-path tools/tasknode-validator-binding/Cargo.toml
          cargo test --locked -p postfiat-node --bin postfiat-node \
            fastswap_service::tests::persistent_wallet_driver_meets_isolated_warm_latency_gate \
            -- --ignored --exact --nocapture
