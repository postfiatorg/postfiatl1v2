name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-node:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the production node with its release features
        run: cargo build --locked --release -p postfiat-node --bin postfiat-node

  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: A666 recovery CI rejection policy
        run: |
          scripts/test-check-a666-recovery-ci-policy
          scripts/check-a666-recovery-ci-policy
      - name: Every test runs in exactly one test job or step
        # test-pq runs the tests named pq_; the steps below run all others.
        run: |
          cargo test --workspace --locked -- --list > "$RUNNER_TEMP/test-list.txt" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/test-list.txt"; exit 1; }
          scripts/check-rust-ci-test-split --listing "$RUNNER_TEMP/test-list.txt"
      - name: cargo test
        run: |
          cargo test --workspace --locked --no-fail-fast -- --skip pq_ \
            --skip transport_batch_payload_tests::a_peer_refusing_past_the_retry_budget_is_asked_until_the_deadline_and_the_round_certifies \
            --skip transport_batch_payload_tests::a_prepare_answered_8s_late_does_not_delay_an_early_quorum_round \
            --skip tests::fail_fast_dos_rejects_bad_sig_bad_pow_and_aborts_siblings
          cargo test --locked --manifest-path tools/tasknode-validator-binding/Cargo.toml
          cargo test --locked -p postfiat-node --bin postfiat-node \
            fastswap_service::tests::persistent_wallet_driver_meets_isolated_warm_latency_gate \
            -- --ignored --exact --nocapture
          cargo test --locked -p postfiat-node --bin postfiat-node \
            validator_signer_socket_tests -- --ignored
          cargo test --locked -p postfiat-node --test validator_signer_two_user_units_process \
            two_user_units_start_the_signer_rpc_and_transport_without_a_data_dir_key -- --ignored --exact
      - name: Transport timing tests, alone on one thread
        # Their wall-clock bounds hold for a round with nothing running beside
        # it. --workspace reuses the build of the step above.
        if: ${{ !cancelled() }}
        run: |
          cargo test --workspace --locked -- --exact --test-threads=1 \
            transport_batch_payload_tests::a_peer_refusing_past_the_retry_budget_is_asked_until_the_deadline_and_the_round_certifies \
            transport_batch_payload_tests::a_prepare_answered_8s_late_does_not_delay_an_early_quorum_round
      - name: Fail-fast timing test of the PQ verifier, optimized and alone
        # Its bounds are milliseconds for rejecting a bad payment. They are a
        # property of the optimized verifier, so it runs in a release build.
        if: ${{ !cancelled() }}
        run: |
          cargo test --release --locked -p postfiat-privacy-binius --lib -- --exact --test-threads=1 \
            tests::fail_fast_dos_rejects_bad_sig_bad_pow_and_aborts_siblings

  test-pq:
    # The PQ payment tests (every test named pq_) prove for real; beside the
    # rest they no longer fit the two-hour limit of `test`.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A smaller debug build for the same tests: panics and backtraces keep
      # file and line.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free runner disk
        # Removes preinstalled software this repository never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: |
            wallet-web/package-lock.json
            wallet-proxy/package-lock.json
      - name: Install wallet test dependencies
        # wallet-proxy's modules let crates/node/tests/private_actions_gateway.rs run the real proxy.
        run: |
          npm ci --prefix wallet-web
          npm ci --prefix wallet-proxy
      - name: cargo test (tests named pq_)
        run: cargo test --workspace --locked -- pq_
