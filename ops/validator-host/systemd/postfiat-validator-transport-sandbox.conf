# Opt-in sandbox drop-in for the validator transport service. Adds the directives that
# systemd/postfiat-cobalt-shadow.service.example already uses on top of the
# directive set in the example unit and in the units batch_snapshot.rs writes.
# Install with ops/validator-host/systemd/install.sh; it never restarts the
# service unless asked. Each directive is checked against the release binary
# by scripts/test-validator-host-sandbox.
[Service]
PrivateDevices=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryDenyWriteExecute=true
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
