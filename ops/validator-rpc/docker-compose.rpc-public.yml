# PostFiat Public TLS Read-Replica RPC (Docker Compose profile)
# Runs non-voting read-replica node isolated behind a dedicated TLS 1.3 Caddy edge.
services:
  postfiat-rpc-public:
    image: ${POSTFIAT_NODE_IMAGE:-ghcr.io/postfiatorg/postfiat-node:latest}
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: "service:postfiat-rpc-edge"
    command:
      - rpc-serve
      - --rpc-profile
      - public-replica
      - --data-dir
      - /var/lib/postfiat-rpc/replica
      - --spool-dir
      - /run/postfiat-rpc-public/spool
      - --ready-file
      - /run/postfiat-rpc-public/ready.json
      - --bind-host
      - 127.0.0.1
      - --port
      - "27651"
      - --max-requests
      - "100000"
      - --timeout-ms
      - "15000"
      - --child-timeout-ms
      - "15000"
      - --max-child-dispatch-concurrent
      - "8"
      - --max-child-dispatch-per-peer
      - "4"
      - --max-replica-lag-blocks
      - "5"
      - --event-log
      - /var/log/postfiat-rpc/rpc-events.ndjson
      - --keep-alive
    volumes:
      - ${POSTFIAT_REPLICA_DATA_DIR:-/var/lib/postfiat-rpc/replica}:/var/lib/postfiat-rpc/replica
      - ${POSTFIAT_REPLICA_LOG_DIR:-/var/log/postfiat-rpc}:/var/log/postfiat-rpc
    tmpfs:
      - /run/postfiat-rpc-public:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/postfiat-node", "rpc-probe", "--host", "127.0.0.1", "--port", "27651", "--timeout-ms", "5000"]
      interval: 15s
      timeout: 5s
      retries: 3

  postfiat-rpc-edge:
    image: caddy:2.8-alpine
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      POSTFIAT_PUBLIC_RPC_DOMAIN: ${POSTFIAT_PUBLIC_RPC_DOMAIN:-rpc.example.postfiat.org}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.public-rpc:/etc/caddy/Caddyfile:ro
      - ${POSTFIAT_EDGE_DATA_DIR:-/var/lib/postfiat-edge}:/data
      - ${POSTFIAT_EDGE_LOG_DIR:-/var/log/postfiat-edge}:/var/log/postfiat-edge
    tmpfs:
      - /config
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: always
