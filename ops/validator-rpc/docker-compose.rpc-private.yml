# PostFiat Private Loopback Read-Replica RPC (Docker Compose profile)
# Strictly non-voting follower; binds loopback only (127.0.0.1:27650).
services:
  postfiat-rpc-private:
    image: ${POSTFIAT_NODE_IMAGE:-ghcr.io/postfiatorg/postfiat-node:latest}
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:27650:27650"
    command:
      - rpc-serve
      - --rpc-profile
      - private-replica
      - --data-dir
      - /var/lib/postfiat-rpc/replica
      - --spool-dir
      - /run/postfiat-rpc-private/spool
      - --ready-file
      - /run/postfiat-rpc-private/ready.json
      - --bind-host
      - 127.0.0.1
      - --port
      - "27650"
      - --max-requests
      - "100000"
      - --timeout-ms
      - "30000"
      - --child-timeout-ms
      - "30000"
      - --max-child-dispatch-concurrent
      - "8"
      - --max-child-dispatch-per-peer
      - "4"
      - --max-replica-lag-blocks
      - "5"
      - --event-log
      - /var/log/postfiat-rpc/rpc-private-events.ndjson
      - --keep-alive
    volumes:
      - ${POSTFIAT_REPLICA_DATA_DIR:-/var/lib/postfiat-rpc/replica}:/var/lib/postfiat-rpc/replica
      - ${POSTFIAT_REPLICA_LOG_DIR:-/var/log/postfiat-rpc}:/var/log/postfiat-rpc
    tmpfs:
      - /run/postfiat-rpc-private:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/postfiat-node", "rpc-probe", "--host", "127.0.0.1", "--port", "27650", "--timeout-ms", "5000"]
      interval: 15s
      timeout: 5s
      retries: 3
