## Post Fiat First-Party Nostr Relay Configuration (relay.postfiat.org)
## Pillar 6: NIP-42 authenticated, registered-member write admission,
## Contract C3 kind allowlist, per-pubkey rate limits, and filtered mirroring.

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 600
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 64
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 65536
    realIpHeader = "X-Real-IP"

    info {
        name = "Post Fiat Hive Relay"
        description = "First-party gated Nostr relay for Post Fiat Hive Chat and on-chain verified identities."
        pubkey = ""
        contact = "ops@postfiat.org"
        icon = "https://postfiat.org/favicon.ico"
        supported_nips = [1, 11, 17, 42]
        software = "https://github.com/hoytech/strfry"
        version = "1.0.4"
        limitation {
            max_message_length = 65536
            max_subscriptions = 20
            max_filters = 20
            max_limit = 500
            max_subid_length = 128
            max_event_tags = 64
            max_content_length = 32768
            auth_required = true
            payment_required = false
            restricted_writes = true
        }
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/etc/strfry/write-policy.py"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }
}
