[package]
name = "pfusdc-arc-ingress-program"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pfusdc-arc-ingress-program"
path = "src/main.rs"
test = false

[dependencies]
alloy-consensus = "=1.8.3"
alloy-eips = "=1.8.3"
alloy-primitives = { version = "=1.5.7", features = ["serde", "sha3-keccak"] }
alloy-rlp = "=0.3.12"
alloy-sol-types = "=1.5.7"
alloy-sol-macro = "=1.5.7"
alloy-sol-type-parser = "=1.5.7"
alloy-trie = "=0.9.5"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11.2"
sp1-zkvm = "=6.3.1"
sha3 = "0.10.8"

[dev-dependencies]
base64 = "0.22"
serde_json = "1.0"

[workspace]

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }
