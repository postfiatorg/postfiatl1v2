[package]
name = "eth-l1-mainnet-fast-lane-p0"
version = "0.1.0"
edition = "2021"
publish = false

[features]
sp1-cuda = ["sp1-sdk/cuda"]

[dependencies]
anyhow = "1.0"
alloy = { version = "=1.8.3", default-features = false, features = ["std", "consensus", "rpc-types", "serde", "sha3-keccak"] }
alloy-trie = "=0.9.5"
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive"] }
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.11.1" }
hex = "0.4"
pfusdc-eth-mainnet-ingress-program = { path = "../../programs/pfusdc-eth-mainnet-ingress" }
postfiat-types = { path = "../../crates/types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0"
sha2 = "0.10"
sp1-helios-primitives = { git = "https://github.com/succinctlabs/sp1-helios", rev = "b9bdddf8221e31d41075d4a97f9a14ca6df13cf0" }
sp1-sdk = { version = "=6.3.1", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tree_hash = "0.10.0"

[workspace]
