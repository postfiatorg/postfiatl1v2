[workspace]
members = [
    "crates/reserve-proof-types",
    "crates/reserve-proof-cli",
]
exclude = [
    "contracts/near-stake-reader",
    "contracts/solana-stake-reader",
    "fuzz",
    "programs/reserve-proof-guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/postfiatorg/postfiatl1v2"

[workspace.dependencies]
alloy-primitives = { version = "1.6.0", features = ["serde", "k256"] }
alloy-rlp = "0.3.15"
alloy-trie = { version = "0.9.5", features = ["ethereum", "serde"] }
anyhow = "1.0"
base64 = "0.22"
base58-monero = "2.0"
bincode = "1.3.3"
bs58 = "0.5"
curve25519-dalek = "4"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4"
k256 = "0.13"
monero = "0.21"
monero-generators-mirror = "0.4"
postfiat-types = { path = "../../crates/types" }
postfiat-nav-reserve-protocol = { path = "../../crates/nav_reserve_protocol" }
postfiat-crypto-provider = { path = "../../crates/crypto_provider" }
reserve-proof-types = { path = "crates/reserve-proof-types" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
sp1-sdk = { version = "=6.3.1", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = { version = "1", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
