[workspace]

[package]
name = "postfiat-solana-stake-reader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/postfiatorg/postfiatl1v2"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=3.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"
