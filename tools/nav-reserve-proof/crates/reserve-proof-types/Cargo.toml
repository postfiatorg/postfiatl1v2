[package]
name = "reserve-proof-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["a666-public-adapters-v2"]
a666-public-adapters-v2 = [
    "dep:bs58",
    "dep:curve25519-dalek",
    "dep:monero",
    "dep:monero-generators-mirror",
    "dep:thiserror",
]

[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
base64.workspace = true
bs58 = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
monero = { workspace = true, optional = true }
monero-generators-mirror = { workspace = true, optional = true }
p384.workspace = true
postfiat-crypto-provider.workspace = true
postfiat-types.workspace = true
rsa.workspace = true
serde.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror = { workspace = true, optional = true }
x509-parser.workspace = true

[dev-dependencies]
k256.workspace = true
serde_json.workspace = true
