[package]
name = "nav-reserve-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1"
reserve-proof-types = { path = "../crates/reserve-proof-types" }

[[bin]]
name = "witness_json"
path = "fuzz_targets/witness_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_evidence_json"
path = "fuzz_targets/source_evidence_json.rs"
test = false
doc = false
bench = false
