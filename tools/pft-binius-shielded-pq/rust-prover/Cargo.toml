[package]
name = "pft-binius-shielded"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["prover"]
prover = ["dep:hmac", "dep:aes-gcm", "dep:fips204", "dep:fips203", "dep:rayon", "dep:rand", "dep:rand_chacha", "dep:serde", "dep:serde_json", "dep:hex"]
portable = []

[[bin]]
name = "pft-binius-shielded"
path = "src/main.rs"
required-features = ["prover"]

[dependencies]
hmac = { version = "0.12.1", optional = true }
sha2 = "0.10.9"
sha3 = "0.10.8"
aes-gcm = { version = "0.10.3", optional = true }
fips204 = { optional = true, version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
fips203 = { version = "0.4.3", optional = true }
rayon = { version = "1.12.0", optional = true }
rand = { version = "0.8.6", optional = true }
rand_chacha = { version = "0.3.1", optional = true }
serde = { optional = true, version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
hex = { version = "0.4.3", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
