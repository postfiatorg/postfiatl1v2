[package]
name = "tasknode-l1-validator-signer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
postfiat-crypto-provider = { path = "../../crates/crypto_provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
