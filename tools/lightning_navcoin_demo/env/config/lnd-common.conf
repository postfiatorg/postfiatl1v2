# Synthetic LND regtest profile. Node identity and alias are supplied per
# service in compose.yml; all three nodes share only this non-secret config.
bitcoin.active=true
bitcoin.regtest=true
bitcoin.node=bitcoind
bitcoin.defaultchanconfs=1
bitcoin.basefee=0
bitcoin.feerate=0
bitcoin.timelockdelta=40

bitcoind.rpchost=bitcoind:18443
bitcoind.rpcuser=pftl_regtest
bitcoind.rpcpass=pftl_regtest_only_not_a_secret_20260724
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333

# Never discover public peers. Peering is explicitly established among the
# three services by envctl.
nobootstrap=true
nat=false
tor.active=false

rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
listen=0.0.0.0:9735
tlsextraip=127.0.0.1
tlsextradomain=localhost
tlsautorefresh=true

# The no-seed-backup mode is explicitly testing-only and auto-initializes an
# unencrypted synthetic wallet. It must never be copied to a value network.
noseedbackup=true
accept-amp=false
accept-keysend=false
allow-circular-route=false
max-cltv-expiry=288
maxpendingchannels=4
minchansize=20000
protocol.wumbo-channels=false
debuglevel=info
