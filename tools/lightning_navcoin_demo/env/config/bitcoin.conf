# Synthetic Bitcoin Core regtest only.
chain=regtest
server=1
daemon=0
printtoconsole=1

# Runtime isolation is also enforced by Docker's internal network. These
# settings independently disable all Bitcoin peer discovery and connections.
listen=0
discover=0
dnsseed=0
fixedseeds=0
listenonion=0
upnp=0
natpmp=0

# RPC is reachable only by containers on the internal bridge and through a
# 127.0.0.1-only host publication. These are fixed synthetic credentials, not
# production secrets.
rpcuser=pftl_regtest
rpcpassword=pftl_regtest_only_not_a_secret_20260724

txindex=1
fallbackfee=0.00001000

# Bitcoin Core 31 requires network-scoped connection and RPC settings in the
# selected network section.
[regtest]
connect=0
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18443
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
