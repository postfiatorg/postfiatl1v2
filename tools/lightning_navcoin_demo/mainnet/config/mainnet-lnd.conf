# Dedicated real-value demo coordinator. RPC is published on host loopback
# only by compose.yml. No REST or peer port is published.
bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=neutrino
fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json

alias=postfiat-navcoin-demo
color=#ff9933
nolisten=true
nat=false
tor.active=false

rpclisten=0.0.0.0:10009
restlisten=127.0.0.1:8080
tlsextraip=127.0.0.1
tlsextradomain=localhost
tlsautorefresh=true

# Mainnet must always use a recoverable seed. Wallet creation remains an
# explicit interactive operation so the recovery words never enter logs.
wallet-unlock-password-file=/run/secrets/wallet-password
wallet-unlock-allow-create=true
backupfilepath=/data/lnd/channel.backup

accept-amp=false
accept-keysend=false
allow-circular-route=false
max-cltv-expiry=288
maxpendingchannels=2
minchansize=500000
protocol.wumbo-channels=false
debuglevel=info
