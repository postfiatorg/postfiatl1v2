[package]
name = "pftl-uniswap-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
sp1-cuda = ["sp1-sdk/cuda"]
sp1-profiling = ["sp1-sdk/profiling"]

[dependencies]
anyhow = "1.0"
bincode = "1.3.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
postfiat-pftl-uniswap-proofs = { path = "../../crates/pftl_uniswap_proofs" }
serde_cbor = "0.11.2"
serde_json = "1.0"
sha2 = "0.10"
sp1-sdk = { version = "=6.3.1", features = ["network"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[workspace]
